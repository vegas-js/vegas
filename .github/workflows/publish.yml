name: Publish
on:
  push:
    tags:
      - "v*"
      - "create-vegas@*"

jobs:
  publish:
    if: github.repository == 'vegas-js/vegas'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify release commit
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit reachable from main." >&2
            echo "Tag: $GITHUB_REF_NAME" >&2
            echo "Commit: $GITHUB_SHA" >&2
            exit 1
          fi
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.18.0"
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Resolve release target
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            v*)
              package_dir="packages/vegas"
              expected_version="${GITHUB_REF_NAME#v}"
              ;;
            create-vegas@*)
              package_dir="packages/create-vegas"
              expected_version="${GITHUB_REF_NAME#create-vegas@}"
              ;;
            *)
              echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
              exit 1
              ;;
          esac

          actual_version="$(
            node -e '
              const fs = require("node:fs");
              const path = process.argv[1];
              const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
              process.stdout.write(pkg.version);
            ' "$package_dir/package.json"
          )"

          if [ "$actual_version" != "$expected_version" ]; then
            echo "Release tag version does not match package version." >&2
            echo "Tag: $GITHUB_REF_NAME" >&2
            echo "Package: $package_dir" >&2
            echo "Expected: $expected_version" >&2
            echo "Actual: $actual_version" >&2
            exit 1
          fi

          version_without_build="${actual_version%%+*}"

          if [[ "$version_without_build" == *-* ]]; then
            prerelease="${version_without_build#*-}"
            npm_dist_tag="${prerelease%%.*}"

            if [[ ! "$npm_dist_tag" =~ ^[a-z][0-9a-z-]*$ ]] \
              || [[ "$npm_dist_tag" == "latest" ]] \
              || [[ "$npm_dist_tag" == v* ]]; then
              echo "Prerelease identifier cannot be used as an npm dist-tag." >&2
              echo "Version: $actual_version" >&2
              echo "Dist-tag: $npm_dist_tag" >&2
              exit 1
            fi
          else
            npm_dist_tag="latest"
          fi

          echo "RELEASE_PACKAGE_DIR=$package_dir" >> "$GITHUB_ENV"
          echo "RELEASE_CHANGELOG=$package_dir/CHANGELOG.md" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$actual_version" >> "$GITHUB_ENV"
          echo "NPM_DIST_TAG=$npm_dist_tag" >> "$GITHUB_ENV"

      - name: Verify release notes
        run: node scripts/release-notes.js "$RELEASE_CHANGELOG" "$RELEASE_VERSION" >/dev/null
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm release:check
      - name: Publish package
        run: pnpm --dir "$RELEASE_PACKAGE_DIR" publish --no-git-checks --tag "$NPM_DIST_TAG"

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve release metadata
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            v*)
              package_dir="packages/vegas"
              version="${GITHUB_REF_NAME#v}"
              release_title="@vegasjs/vegas $GITHUB_REF_NAME"
              primary_release="true"
              ;;
            create-vegas@*)
              package_dir="packages/create-vegas"
              version="${GITHUB_REF_NAME#create-vegas@}"
              release_title="create-vegas $version"
              primary_release="false"
              ;;
            *)
              echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
              exit 1
              ;;
          esac

          version_without_build="${version%%+*}"

          if [[ "$version_without_build" == *-* ]]; then
            prerelease="true"
          else
            prerelease="false"
          fi

          if [[ "$primary_release" == "true" && "$prerelease" == "false" ]]; then
            latest="true"
          else
            latest="false"
          fi

          echo "RELEASE_CHANGELOG=$package_dir/CHANGELOG.md" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=$release_title" >> "$GITHUB_ENV"
          echo "RELEASE_PRERELEASE=$prerelease" >> "$GITHUB_ENV"
          echo "RELEASE_LATEST=$latest" >> "$GITHUB_ENV"

      - name: Prepare release notes
        run: node scripts/release-notes.js "$RELEASE_CHANGELOG" "$RELEASE_VERSION" > release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            args=(
              "$GITHUB_REF_NAME"
              --verify-tag
              --title "$RELEASE_TITLE"
              --notes-file release-notes.md
            )

            if [ "$RELEASE_PRERELEASE" = "true" ]; then
              args+=(--prerelease)
            else
              args+=(--prerelease=false)
            fi

            if [ "$RELEASE_LATEST" = "true" ]; then
              args+=(--latest)
            else
              args+=(--latest=false)
            fi

            gh release edit "${args[@]}"
            exit 0
          fi

          args=(
            "$GITHUB_REF_NAME"
            --verify-tag
            --title "$RELEASE_TITLE"
            --notes-file release-notes.md
          )

          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          if [ "$RELEASE_LATEST" = "true" ]; then
            args+=(--latest)
          else
            args+=(--latest=false)
          fi

          gh release create "${args[@]}"
