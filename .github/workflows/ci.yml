name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: "node@22.18.0"
          cache: true
      - run: pnpm exec playwright install --with-deps --only-shell chromium firefox webkit
      - run: pnpm release:check
        env:
          VEGAS_PLAYWRIGHT_BROWSER_MATRIX: "1"
