name: ci
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: "node@22.18.0"
          cache: true
      - run: pnpm exec playwright install --with-deps --only-shell chromium firefox webkit
      - run: pnpm release:check
        env:
          VEGAS_PLAYWRIGHT_BROWSER_MATRIX: "1"
